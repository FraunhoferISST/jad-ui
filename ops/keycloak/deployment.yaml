apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.5.2
          args:
            - start-dev
            - --import-realm
            - --hostname-strict=false
            - --proxy-headers=xforwarded
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: keycloak-admin
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            # Bound the dev JVM heap independently of host/container RAM and
            # leave room for metaspace, native memory and startup augmentation.
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms128m -Xmx512m"
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 50
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 400
            periodSeconds: 20
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
