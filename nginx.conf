server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration must not be cached or fall back to the Angular shell.
    location /config/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Angular handles client-side routes, including direct links and login callbacks.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
