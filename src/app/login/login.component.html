<div class="flex min-h-screen items-center justify-center bg-base-200 p-4">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title justify-center text-2xl">Sign in</h1>
      <p class="text-center text-sm text-base-content/60">
        Access the JAD UI
      </p>

      @if (error()) {
        <div role="alert" class="alert alert-error alert-soft mt-2">
          <span>{{ error() }}</span>
        </div>
      }

      <div class="alert alert-info alert-soft mt-3 text-sm">
        <span class="material-symbols-rounded">shield_person</span>
        <span>Authentication is handled by Keycloak using OAuth 2.0 / OpenID Connect.</span>
      </div>

      <div class="mt-3">
        <button
          type="button"
          class="btn btn-primary btn-block"
          (click)="signInWithSso()"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          Sign in with SSO
        </button>
      </div>

      <div class="divider my-2 text-xs text-base-content/50">Not a participant yet?</div>
      <a routerLink="/register" class="btn btn-soft btn-block">
        <span class="material-symbols-rounded">how_to_reg</span>
        Request Tenant
      </a>

    </div>
  </div>
</div>
