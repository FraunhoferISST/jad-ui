<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="grid grid-cols-1 gap-4 items-start overflow-y-auto h-full [&_label]:shrink-0"
>
  <h1 class="text-xl text-center divider m-0">Register Tenant</h1>

  <fieldset class="fieldset w-full bg-base-200 border border-base-300 p-4 rounded-box">
    <legend class="fieldset-legend text-sm">Common Fields</legend>
    <legend class="fieldset-label">Tenant Name</legend>
    <label
      class="input flex items-center tooltip tooltip-info tooltip-top w-full"
      data-tip="A participant profile is created automatically for the tenant"
    >
      <span class="material-symbols-rounded opacity-50">person_add</span>
      <input type="text" class="grow" placeholder="Tenant Name" formControlName="tenantName" />
      <span class="badge badge-error">Required</span>
    </label>

    <legend class="fieldset-label">Generated DID</legend>
    <label class="input flex items-center w-full">
      <span class="material-symbols-rounded opacity-50">badge</span>
      <input
        type="text"
        class="grow"
        readonly
        placeholder="Enter a tenant name to generate a DID"
        [value]="generatedDid"
      />
      <span class="badge badge-warning">Readonly</span>
    </label>
  </fieldset>

  <p class="text-sm text-base-content/60">
    Registration does not join a dataspace. The tenant admin manages membership after onboarding.
  </p>

  <fieldset class="fieldset w-full bg-base-200 border border-base-300 p-4 rounded-box">
    <legend class="fieldset-legend text-sm">Properties</legend>
    <lib-json-object-input
      [object]="properties"
      (objectChange)="properties = $event"
    ></lib-json-object-input>
  </fieldset>

  <div class="flex flex-col items-center">
    <div class="divider mt-0"></div>
    <button type="submit" [disabled]="form.invalid" class="btn btn-lg w-full btn-primary">
      <i class="material-symbols-rounded">person_add</i>
      Register Tenant
    </button>
  </div>
</form>
